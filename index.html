<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>村驴隋坡菜单换算器</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="菜单">
<meta name="theme-color" content="#1f6b45">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: one column, a menu board of rows; a dish opens as a sheet with a scale readout on top */
  --bg:#eef1ee;        /* tile grey-green */
  --panel:#ffffff;
  --ink:#16211c;
  --muted:#5d6b64;
  --line:#d3dad5;
  --accent:#1f6b47;    /* scallion green */
  --accent-ink:#ffffff;
  --warn:#b3261e;      /* chili red, for cautions only */
  --readout:#0f1a15;
  --readout-ink:#c9f5d9;
  --display:"Noto Serif SC","Songti SC","SimSun",serif;
  --body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111613;--panel:#1a211d;--ink:#e8eeea;--muted:#9aa8a0;--line:#2e3832;
    --accent:#5fc391;--accent-ink:#0c1410;--warn:#ff8a80;--readout:#070b09;--readout-ink:#b9f3cf;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111613;--panel:#1a211d;--ink:#e8eeea;--muted:#9aa8a0;--line:#2e3832;
  --accent:#5fc391;--accent-ink:#0c1410;--warn:#ff8a80;--readout:#070b09;--readout-ink:#b9f3cf;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:680px;margin:0 auto;padding:20px 16px 56px;display:flex;flex-direction:column;gap:18px}
#view-dish{position:fixed;inset:0;z-index:50;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);padding:calc(20px + env(safe-area-inset-top)) 16px calc(56px + env(safe-area-inset-bottom))}
#view-dish[hidden]{display:none}
#view-dish>div{max-width:648px;margin:0 auto}
.ver{font-size:12px;color:var(--muted,#888);margin-top:-8px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:30px;font-weight:900;letter-spacing:.02em}
h2{font-size:26px;font-weight:900}
h3{font-size:15px;font-weight:600;font-family:var(--body);color:var(--muted);letter-spacing:.08em}
p{margin:0}
.sub{color:var(--muted);font-size:14px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* menu */
.menu{list-style:none;margin:0;padding:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.menu li+li{border-top:1px solid var(--line)}
.menu .rowbtn{display:grid;grid-template-columns:1fr auto;gap:2px 12px;flex:1;min-width:0;text-align:left;background:none;border:0;padding:14px 16px;cursor:pointer}
.menu .rowbtn:hover{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.menu .name{font-family:var(--display);font-size:19px;font-weight:600}
.menu .base{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:700;font-size:14px;align-self:center;white-space:nowrap}
.menu .tag{grid-column:1/-1;color:var(--muted);font-size:13px}

/* collapsible */
details>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"";margin-left:auto;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
details[open]>summary::after{transform:rotate(45deg)}
@media (prefers-reduced-motion:reduce){details>summary::after{transition:none}}
.sec>summary{padding:12px 16px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.sec[open]>summary{border-radius:14px 14px 0 0;border-bottom:0}
.sec[open]>.menu{border-radius:0 0 14px 14px}
.st{font-family:var(--display);font-size:18px;font-weight:900}
.cnt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.fchip{font-size:14px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chef{font-family:var(--body);font-size:11px;font-weight:700;border-radius:4px;padding:1px 5px;margin-left:8px;vertical-align:middle;white-space:nowrap}
.c-c{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.c-s{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
details.card>summary+*{margin-top:0}

.menu li{display:flex;align-items:stretch}
.star{flex:none;width:48px;background:none;border:0;border-left:1px solid var(--line);font-size:20px;cursor:pointer;color:var(--muted)}
.star[aria-pressed="true"]{color:var(--warn)}
.c-d{background:color-mix(in srgb,var(--ink) 10%,transparent);color:var(--ink)}
.nohot{color:var(--muted,#888);font-weight:400;border-style:dashed}
.hot{display:inline-block;font-size:11px;font-weight:700;color:var(--warn);border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-right:6px;font-variant-numeric:tabular-nums}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:18px 16px;color:var(--muted);font-size:14px}
#d-star[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:var(--panel)}

.menu .rowbtn{grid-template-columns:52px 1fr auto}
.thumb{grid-row:1/3;width:52px;height:52px;border-radius:50%;overflow:hidden;display:block;align-self:center}
.thumb svg,.thumb img{width:100%;height:100%;display:block;object-fit:cover}
.thumb img.art{transform:scale(1.5)}
.thumb img.art.r{transform:none}
.menu .tag{grid-column:2/-1}
.herowrap{display:flex;flex-direction:column;gap:8px}
.heroimg{display:flex;justify-content:center;align-items:center;aspect-ratio:16/9;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.heroimg svg{height:88%;width:auto}
.heroimg img{width:100%;height:100%;object-fit:cover;display:block}
.heroimg img.art{width:auto;height:100%;object-fit:contain}
.heroimg:has(img.art){background:#6e5036}
.herobar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
label.fchip{display:inline-block}
.vh:focus-visible+button,.vh:focus-visible{outline:3px solid var(--accent)}

.search{display:flex;gap:8px;align-items:center}
.search input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:10px 16px}
.search input::placeholder{color:var(--muted)}

/* dish */
.back{align-self:flex-start;background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px}
.readout{background:var(--readout);color:var(--readout-ink);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.readout label{font-size:13px;opacity:.8}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.readout input{flex:1 1 120px;min-width:0;font:700 28px/1.2 ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;background:transparent;color:inherit;border:0;border-bottom:2px solid currentColor;padding:2px 0;border-radius:0}
.readout select,.chip{font:inherit;font-size:14px;background:transparent;color:inherit;border:1px solid currentColor;border-radius:8px;padding:6px 10px;cursor:pointer}
.readout select option{color:#111;background:#fff}
.chip[aria-pressed="true"]{background:var(--readout-ink);color:var(--readout)}
.factor{font-size:13px;opacity:.85;font-variant-numeric:tabular-nums}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:7px 0;border-top:1px solid var(--line);vertical-align:top}
tr:first-child td{border-top:0}
td.q{text-align:right;font-weight:700;white-space:nowrap;padding-left:12px}
td .n{font-size:13px;color:var(--muted);display:block}
.fixed{font-size:11px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px}
ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:10px}
ol b{color:var(--accent);font-variant-numeric:tabular-nums}
.tips{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.tips li{border-left:3px solid var(--warn);padding-left:10px}
.src{font-size:13px;color:var(--muted)}
a{color:var(--accent)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">

<section id="view-menu">
  <div style="display:flex;flex-direction:column;gap:18px">
    <header>
      <h1>村驴 · 隋坡 · 老东北</h1>
      <p class="ver" id="ver"></p>
      <p class="sub">按你手里的食材重量换算调料。点分类展开，点菜名看用料和步骤。配图是示意图，可以换成自己的照片。</p>
    </header>
    <div class="search"><label for="q" class="vh">搜索</label><input id="q" type="search" placeholder="搜菜名、食材、调料" autocomplete="off" enterkeyhint="search"><button type="button" id="q-clear" class="fchip" hidden>清除</button></div>
    <div class="row" id="chefs"></div>
    <div class="bar"><div class="row" id="views"></div></div>
    <div id="menu" style="display:flex;flex-direction:column;gap:10px"></div>
    <p class="src">配方整理自网友按村驴、隋坡（隋卞一做）、老东北美食视频记录的文字版（下厨房、小红书、抖音等），没有逐条对照原视频核对。标「※」的地方文字版缺失或存疑，请以原视频为准。</p>
  </div>
</section>

<section id="view-dish" hidden>
  <div style="display:flex;flex-direction:column;gap:14px">
    <button class="back" id="back" type="button">← 返回菜单</button>
    <header>
      <h2 id="d-name"></h2>
      <p class="sub" id="d-tag"></p>
      <p class="sub" id="d-hot"></p>
      <button type="button" class="fchip" id="d-star" style="margin-top:8px"></button>
    </header>

    <div class="herowrap">
      <div id="hero"></div>
      <div class="herobar">
        <span class="sub" id="hero-cap"></span>
        <span class="row">
          <label class="fchip" for="img-file">换成我的照片</label>
          <input id="img-file" type="file" accept="image/*" class="vh">
          <button type="button" class="fchip" id="img-clear">恢复示意图</button>
        </span>
      </div>
      <p class="sub" id="img-msg" role="status"></p>
    </div>

    <div class="readout" id="readout">
      <label for="amt" id="amt-label"></label>
      <div class="row">
        <input id="amt" type="number" inputmode="decimal" enterkeyhint="done" min="0" step="any">
        <select id="unit" aria-label="单位"></select>
        <button type="button" id="amt-done" class="chip">完成</button>
      </div>
      <div class="row" id="quick"></div>
      <div class="factor" id="factor"></div>
    </div>

    <div id="d-groups" style="display:flex;flex-direction:column;gap:14px"></div>

    <details class="card" id="d-steps-card" open>
      <summary><h3>步骤</h3></summary>
      <ol id="d-steps"></ol>
    </details>

    <details class="card" id="d-tips-card" open>
      <summary><h3>注意</h3></summary>
      <ul class="tips" id="d-tips"></ul>
    </details>

    <p class="src" id="d-src"></p>
  </div>
</section>

</div>
<script>
/* q: number | [lo,hi] | null (then t is shown as-is). fix:true = does not scale.
   In steps, {{n}} is a quantity that scales with the main ingredient. */
const DISHES=[
{id:"guobaorou",hot:[46.3,"抖音","万赞"],name:"锅包肉",tag:"东北老式，白糖米醋的糖醋口",main:"通脊肉（大里脊）",base:400,unit:"g",
 groups:[
  ["主料",[["通脊肉",400,"g"],["盐（腌肉）",2,"g"]]],
  ["挂糊",[["土豆淀粉",250,"g","至少提前 1 小时泡水"],["清水",3,"汤勺"],["食用油",2,"汤勺","豆油颜色更好"]]],
  ["糖醋汁",[["白糖",90,"g","可减"],["9 度米醋",75,"g"],["生抽",5,"g"],["盐",2,"g"],["玉米淀粉",2,"g"],["清水（调淀粉）",7,"g"]]],
  ["配菜",[["大蒜",4,"粒","切片"],["姜",2,"片","切丝"],["葱白丝、胡萝卜丝、香菜段",null,"","适量"],["炸肉用油",null,"","宽油",true]]]],
 steps:[
  "土豆淀粉 {{250}}g 加水浸泡至少 1 小时，泡透后把上面的清水倒掉。",
  "里脊斜刀切片，厚度约等于筷子头。清水洗两遍后攥去水分，加 {{2}}g 盐抓到发黏起胶。",
  "调糖醋汁：白糖 {{90}}g、米醋 {{75}}g、生抽 {{5}}g、盐 {{2}}g，再加淀粉水（玉米淀粉 {{2}}g + 水 {{7}}g）搅匀。",
  "把沉底的湿淀粉抓碎，放入肉片，加 {{3}} 汤勺清水抓匀，状态是能缓慢流动、碗底没有多余干粉。再加 {{2}} 汤勺油抓匀。",
  "宽油下锅，肉片逐片下锅炸到定型浅黄，捞出。",
  "油继续大火升到 190–200℃，肉片回锅复炸到金黄酥脆，捞出。",
  "锅里留一点底油烧到冒烟，糖醋汁搅匀后倒入，不停搅动约 20 秒熬到略微挂铲，淋一点炸肉的油。",
  "下肉片和配菜，快速翻匀裹汁出锅。"],
 tips:["一定用土豆淀粉并提前泡，现调的糊炸不出那个壳。","醋用 9 度米醋；5 度醋酸度不够。","复炸的油量和时间不用按比例加，分批炸即可。"],
 src:[["下厨房文字版","https://m.xiachufang.com/recipe/107651718/"]]},

{id:"tangcu-paigu",hot:[5.2,"抖音","万赞"],name:"糖醋排骨",tag:"不炒糖色，冰糖加番茄沙司和腐乳汁",main:"排骨",base:1000,unit:"g",
 groups:[
  ["主料",[["新鲜排骨",1000,"g"],["姜",15,"g","约 4 小片"],["黄酒",13,"g","约 1 勺"],["热水",[500,600],"ml","没过排骨即可",true]]],
  ["料汁",[["冰糖",60,"g"],["5 度白醋",30,"g"],["生抽",40,"g"],["番茄沙司",30,"g"],["红腐乳汁",10,"g"],["老抽",4,"g"]]],
  ["收尾",[["5 度白醋",30,"g"],["熟白芝麻",10,"g"]]]],
 steps:[
  "排骨泡水 30 分钟去血水（不新鲜的先焯水），用厨房纸吸干，避免溅油。",
  "料汁的 6 样调料提前拌匀。",
  "热油大火下姜片炸到金黄，下排骨不停翻炒 6–7 分钟，炒到锅底的油由浑变清、排骨表面微黄。",
  "沿锅边淋 {{13}}g 黄酒，炒到酒气散掉，倒入料汁翻匀。",
  "加热水没过排骨，烧开后盖盖小火炖到软烂 ※ 炖多久文字版没写，以视频为准。",
  "开盖大火收汁，快好时加收尾的 {{30}}g 白醋翻匀，撒芝麻出锅。"],
 tips:["热水量看锅的大小，不用跟着排骨等比例加。","后加的那份醋是提酸味的，别和料汁一起下。"],
 src:[["下厨房文字版","https://m.xiachufang.com/recipe/107580258/"]]},

{id:"shuinen-jipai",buzz:"2026 年凭减脂餐教程再度刷屏",name:"水嫩鸡排",tag:"鸡胸肉腌一夜，煎出来不柴，可冷冻备餐",main:"鸡胸肉",base:1200,unit:"g",
 groups:[
  ["主料",[["鸡胸肉",1200,"g","约 5 块"]]],
  ["腌料",[["小苏打",7,"g","不能超量"],["洋葱粉",2,"g"],["大蒜粉",2,"g"],["白胡椒粉",0.5,"g"],["味精",5,"g","可减"],["盐",3,"g"],["奥尔良腌料",20,"g"],["清水",250,"g"],["玉米淀粉",90,"g"]]]],
 steps:[
  "鸡胸洗净，用厨房纸彻底擦干，修掉筋膜和肥油，每块横着片成 3–4 片。",
  "小苏打 {{7}}g、洋葱粉 {{2}}g、大蒜粉 {{2}}g、白胡椒 {{0.5}}g、味精 {{5}}g、盐 {{3}}g、奥尔良腌料 {{20}}g，加清水 {{250}}g 搅匀。",
  "再加玉米淀粉 {{90}}g，搅到没有颗粒。",
  "放入鸡肉翻拌 1 分钟，每片都挂上料，封保鲜膜冷藏腌一夜。",
  "第二天取出再翻拌均匀。锅里薄薄一层油，大火烧热后下鸡排，煎到两面金黄。也可以用水煎。",
  "吃不完的分装冷冻。"],
 tips:["小苏打多了会发苦，换算后请用精确到 0.1g 的秤。","没有洋葱粉、大蒜粉，可用洋葱丝和蒜末代替。","不少人觉得原配方偏淡，可以蘸料吃。"],
 src:[["下厨房文字版","https://m.xiachufang.com/recipe/107630779/"]]},

{id:"luobo-niurou",name:"港式萝卜牛肉煲",tag:"柱侯酱打底，牛肋条或带筋牛腩",main:"牛肉",base:1000,unit:"g",
 groups:[
  ["主料",[["牛肋条或带筋牛腩",1000,"g"],["白萝卜",500,"g"]]],
  ["小料",[["大葱",20,"g"],["大蒜",15,"g"],["姜",15,"g"],["八角",2,"个"],["干辣椒",null,"","按口味"]]],
  ["酱料",[["柱侯酱",60,"g"],["生抽",20,"g"],["花生酱",10,"g"],["红腐乳",1,"块"],["蚝油",25,"g"],["冰糖",10,"g"]]]],
 steps:[
  "牛肉切两指宽的块（用高压锅就切三指宽）。葱斜切厚片，姜蒜切片。",
  "牛肉冷水下锅焯水，什么都不放，水一开就关火，用温水冲洗干净。",
  "锅里放正常炒菜量的油，凉油下葱姜蒜，中火煸到微微焦黄，转最小火。",
  "下酱料和香料炒香，放入牛肉翻匀，加水 ※ 这一段文字版不完整，加水量以视频为准。",
  "大火烧开，盖盖转最小火炖 1 个半小时。",
  "加入白萝卜 {{500}}g，重新烧开后盖盖最小火再炖 40 分钟。"],
 tips:["炖煮时间不随重量变化，肉多只需要换大锅。"],
 src:[["下厨房文字版","https://m.xiachufang.com/recipe/107449187/"]]},

{id:"niunan-fan",name:"牛腩饭",tag:"3 斤牛腩的大份配方，酱料也能炖鸡肉",main:"牛腩或牛肋条",base:1500,unit:"g",

 steps:[

/* cloud sync (only inside Claude; elsewhere claude.use is absent and this is a no-op) */
let cloud=null;const cloudBusy={},cloudDirty={};
async function cloudWrite(key,fn){if(!cloud)return;if(cloudBusy[key]){cloudDirty[key]=true;return}cloudBusy[key]=true;
  try{do{cloudDirty[key]=false;await fn(cloud.doc(key))}while(cloudDirty[key])}catch(_){}cloudBusy[key]=false}
function pushFavs(){cloudWrite("favs",r=>r.set({ids:[...favs],t:Date.now()}))}

function fmt(x){
  if(x>=100) return String(Math.round(x));
  if(x>=10) return String(Math.round(x*2)/2).replace(/\.0$/,"");
  const r=Math.round(x*10)/10;
  if(r===0&&x>0) return x.toFixed(2).replace(/0+$/,"");
  return String(r).replace(/\.0$/,"");
}

function recalc(){
  const v=parseFloat($("amt").value);
  const sel=$("unit");
  const per=sel.options.length?parseFloat(sel.value):1;
  factor=(v>0&&isFinite(v))?(v*per)/cur.base:1;
  if(!(v>0)) { $("factor").textContent=""; }
  document.querySelectorAll("#quick .chip").forEach(c=>c.setAttribute("aria-pressed",String(Math.abs(parseFloat(c.dataset.f)-factor)<1e-6)));
  renderBody();
  if(!(v>0)) $("factor").textContent="输入一个大于 0 的数，下面先按原配方显示。";
}

$("amt").addEventListener("input",recalc);
$("unit").addEventListener("change",recalc);
function dropKb(){const a=document.activeElement;if(a&&(a.id==="amt"||a.id==="q"))a.blur()}
$("amt-done").addEventListener("click",dropKb);
["amt","q"].forEach(id=>$(id).addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();e.target.blur()}}));
["touchstart","mousedown"].forEach(t=>document.addEventListener(t,e=>{const el=e.target;if(el&&el.closest&&el.closest("input,select,textarea,#amt-done"))return;dropKb()},{passive:true}));
const kbScroll=()=>{const a=document.activeElement;if(a&&a.id==="amt"&&Date.now()-kbT>1000)a.blur()};window.addEventListener("scroll",kbScroll,{passive:true});$("view-dish").addEventListener("scroll",kbScroll,{passive:true});
let kbT=0;$("amt").addEventListener("focus",()=>{kbT=Date.now()});
$("quick").addEventListener("click",e=>{
  const c=e.target.closest(".chip"); if(!c) return;
  const per=parseFloat($("unit").value)||1;
  $("amt").value=fmt(cur.base*parseFloat(c.dataset.f)/per);
  factor=parseFloat(c.dataset.f);
  document.querySelectorAll("#quick .chip").forEach(x=>x.setAttribute("aria-pressed",String(x===c)));
  renderBody();
});
window.addEventListener("hashchange",route);
$("ver").textContent="版本 "+APP_VERSION+" · "+APP_DATE+" · "+DISHES.length+" 道菜";
renderMenu();route();rasterizeThumbs();
(async()=>{try{
  if(!window.claude||typeof window.claude.use!=="function")return;
  const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
  if(!db||!user)return;const uid=await user.id();if(!uid)return;
  const col=db.collection("data/users/"+uid);const snap=await col.get();
  const known=new Set(DISHES.map(d=>d.id));let remoteFavs=null;
  snap.docs.forEach(x=>{const v=x.data()||{};
    if(x.id==="favs"&&Array.isArray(v.ids))remoteFavs=v.ids.filter(i=>known.has(i));
    else if(x.id.startsWith("img-")&&typeof v.src==="string"&&known.has(x.id.slice(4))&&!imgs[x.id.slice(4)])imgs[x.id.slice(4)]=v.src;});
  cloud=col;
  const merged=new Set([...(remoteFavs||[]),...favs]);
  const needPush=!remoteFavs||merged.size!==remoteFavs.length;
  favs=merged;try{localStorage.setItem("menu-favs",JSON.stringify([...favs]))}catch(_){}
  Object.keys(imgs).forEach(id=>{if(!snap.docs.some(x=>x.id==="img-"+id))pushImg(id)});
  if(needPush)pushFavs();
  renderMenu();if(cur){syncDishStar();renderHero()}
}catch(_){}})();
</script>
</body>
</html>
